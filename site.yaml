  muebles:
    activa: true
    antetitulo: Lo que vendemos
    titulo: Del salón al dormitorio
    texto: "Muebles de fábricas españolas y portuguesas, en exposición y con medidas a elegir. Los precios son de partida: el tuyo te lo cerramos en el proyecto."
    muebles:
      - nombre: Salones y comedores
        texto: "Composiciones de salón, aparadores, mesas extensibles y sillas a juego."
        precio: "desde 890 €"
        imagen: /fotos/salon.jpg
        imagenes: "/fotos/salon.jpg; /fotos/ambiente-comedor.jpg"
        detalle: |
          En la planta baja tenemos montados una docena de salones completos: composiciones de pared con vitrina y hueco para la tele, aparadores bajos, mesas extensibles y sillas a juego. Están en roble, nogal y lacados mate, y casi todos se fabrican en otras medidas y acabados.

          Lo habitual es que vengas con las medidas de la pared o que vayamos nosotros a tomarlas. Con eso te dibujamos el salón en planta y en 3D, con dos o tres opciones, para que veas cómo queda antes de decidir.

          Las mesas extensibles las puedes abrir en la tienda y las sillas, probarlas en la mesa que vas a llevar. Si tienes una pieza que quieres conservar, la tenemos en cuenta en el proyecto para que todo encaje.
      - nombre: Sofás y sillones
        texto: "Sofás de dos y tres plazas, chaise longue, rinconeras y relax eléctricos."
        precio: "desde 690 €"
        imagen: /fotos/sofas.jpg
        detalle: |
          Tenemos más de treinta sofás en exposición para sentarse con calma: de dos y tres plazas, con chaise longue, rinconeras modulares y sillones relax con motor. Cada modelo se puede pedir en otras medidas y en un muestrario de más de cien telas, desde linos y chenillas hasta telas antimanchas para casas con niños o mascotas.

          Te ayudamos a elegir la firmeza del asiento y el fondo que te conviene según tu altura y cómo usas el salón. Antes de pedirlo, medimos el hueco y también la puerta, el portal y el ascensor, para que el sofá llegue sin sorpresas.

          El transporte y el montaje van incluidos en Tudela y la Ribera, y nos llevamos el sofá viejo si lo necesitas.
      - nombre: Dormitorios
        texto: "Camas, cabeceros, mesitas, cómodas y armarios de puertas correderas o batientes."
        precio: "desde 1.150 €"
        imagen: /fotos/dormitorio.jpg
        detalle: |
          En la primera planta están los dormitorios de matrimonio: camas con canapé o somier, cabeceros tapizados o de madera, mesitas, cómodas y sinfoniers. Los armarios se hacen a medida de tu hueco, con puertas correderas o batientes y el interior repartido como necesites.

          Medimos la habitación, te dibujamos la distribución con las puertas y las ventanas y te damos el presupuesto cerrado con el montaje incluido. Si quieres aprovechar un cabecero o una cómoda que ya tienes, lo tenemos en cuenta en el plano.
      - nombre: Juveniles e infantiles
        texto: "Camas nido, literas, compactos con escritorio y armarios que crecen con ellos."
        precio: "desde 790 €"
        imagen: /fotos/juvenil.jpg
      - nombre: Colchones y descanso
        texto: "Colchones, bases, almohadas y canapés para probar tumbado, sin prisas."
        precio: "desde 390 €"
        imagen: /fotos/colchones.jpg
        detalle: |
          Un colchón hay que probarlo tumbado y con tiempo. En la zona de descanso tenemos colchones de muelles ensacados, viscoelásticos y de látex en varias firmezas, con sus bases, canapés abatibles y almohadas, para que los pruebes en la misma postura en la que duermes.

          Te preguntamos cómo duermes, si compartes cama y si te levantas con dolores, y te enseñamos tres o cuatro opciones, no treinta. Las medidas especiales se piden a fábrica sin coste añadido en la mayoría de modelos.

          Lo llevamos a casa, lo montamos sobre la base y nos llevamos el colchón viejo al punto limpio.
      - nombre: Cocinas
        texto: "Cocinas a medida con proyecto, encimeras, electrodomésticos y montaje."
        precio: Consultar
        imagen: /fotos/cocina.jpg
      - { nombre: Muebles de exterior, texto: "Conjuntos de terraza, tumbonas y sombrillas para patios y balcones.", precio: "desde 450 €" }
      - { nombre: "Iluminación, textil y cortinas", texto: "Lámparas, alfombras, cojines y cortinas confeccionadas a tu medida." }

