  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que cuentan al volver
    testimonios:
      - { texto: "Nos midieron el salón, nos lo enseñaron en 3D y el sofá entró por la puerta a la primera. Montaron todo en una mañana.", autor: Marta y Javier, nota: Google }
      - { texto: "Probé seis colchones tumbada y sin nadie metiéndome prisa. Duermo mejor desde entonces.", autor: Pilar G., nota: Google }
      - { texto: "Hicimos el dormitorio de los chicos con armario a medida. Quedó aprovechado hasta el último hueco.", autor: Rubén A., nota: Facebook }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    texto: "Si tu duda no está aquí, llámanos o escríbenos por WhatsApp."
    preguntas:
      - { pregunta: "¿Hace falta pedir cita para ver la exposición?", respuesta: "No, abrimos sin cita. Con cita te atiende la persona que hará tu proyecto y te reservamos el tiempo que necesites." }
      - { pregunta: "¿Cuánto tarda en llegar un mueble?", respuesta: "Lo que está en almacén, en una semana. Lo que se fabrica a medida, entre cuatro y ocho semanas según la fábrica. Te damos la fecha al hacer el pedido." }
      - { pregunta: "¿El transporte y el montaje se pagan aparte?", respuesta: "En Tudela y en la Ribera van incluidos. Si vives más lejos, te lo decimos en el presupuesto antes de comprar." }
      - { pregunta: "¿Puedo probar los colchones antes de comprar?", respuesta: "Sí. En la primera planta tienes la zona de descanso para probarlos tumbado y con calma, con almohada incluida." }
      - { pregunta: "¿Se puede pagar a plazos?", respuesta: "Sí, con una financiera. El estudio se hace en la tienda en unos minutos y te decimos la cuota antes de firmar." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Pide cita o presupuesto
    texto: "Cuéntanos qué estancia quieres amueblar y, si puedes, las medidas o un plano. Te contestamos en el día."
